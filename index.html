<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Music Player V2</title>
  </head>
  <body>
    <header>
      <h1>Music Player V2</h1>
    </header>

    <main>
      <section id="player-section">
        <div>
          <h2>Select a track from your library</h2>
          <input type="file" id="input-file" accept="audio/*" />
          <div id="input-track-container" class="example-track-container">
            <h3 class="input-track-title"></h3>
          </div>
        </div>

        <div class="separator"></div>

        <div id="example-tracks">
          <h2>Or Select one from the example tracks:</h2>
          <small
            >Royalty-Free Example Tracks from
            <a
              href="https://pixabay.com/music/search/no%20copyright%20music/"
              target="_blank"
              class="pixabay-link"
              >pixabay</a
            ></small
          >
          <br />
          <ul id="example-tracks-list"></ul>
        </div>        
     
      <canvas id="visualyser-canvas" width="500" height="200"></canvas>

      </section>

      <audio
        id="audio-example-1"
        src="./meditation-spiritual-alex-morgan.mp3"
        preload="metadata"
      ></audio>
      <audio
        id="audio-example-2"
        src="./funk-moodmode.mp3"
        preload="metadata"
      ></audio>

      
      <section>
        <div id="progress-bar-container">
          <div id="progress-bar-indicator"></div>
        </div>

        <div id="controls" class="controls">
          <div class="control">
            <button id="playback-toggle" disabled>Play</button>
            <button id="control-stop">Stop</button>
          </div>

          <div class="track-time-data">
            <h2 id="track-name">---</h2>
            <span id="track-currenttime">0:00</span>
            /
            <span id="track-duration">0:00</span>
          </div>

          <div class="control player-extra-config">
            <input
              type="range"
              id="volumen-input"
              min="0.00"
              max="1.00"
              step="0.01"
              value="0.50"
            />
            <button id="repeat-toggle">Repeat</button>
          </div>
        </div>
      </section>
    </main>

    <script src="index.js"></script>
  </body>
</html>
